
<div class="bg-gray-300 dark:bg-gray-800 min-h-screen p-5 ">
  <h1 class="text-center md:text-left text-[20px] md:text-2xl font-bold text-black mx-1 md:mx-7 ">Dashboard User</h1>
  <div class="grid grid-cols-1  md:grid-cols-4 gap-4 p-4 ">
    @for (item of dash(); track item.id) {
      
      <div class=" h-[100px] mt-2 bg-white rounded-xl border border-gray-200">
        <div class="p-4">
          <h3 class="font-semibold text-gray-800">
            {{item.title}}
          </h3>
          <p class="mt-2 text-xl font-bold text-green-500">{{item.value}}</p>
        </div>
      </div>
    }@empty {
      <div class="">
        <p class="text-gray-500">loading.</p>
      </div>
    }
  </div>
  <div>

  </div>
</div>
