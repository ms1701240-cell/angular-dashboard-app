<div [class.dark]="themeservie.isdarkmode()" class="min-h-screen bg-white dark:bg-gray-900 text-black dark:text-white transition-colors duration-300 flex flex-col">
  
  <!-- Header Wrapper -->
  <header class="w-full fixed top-0 left-0 right-0 z-40 bg-white dark:bg-gray-800 shadow-sm">
    <app-navbar></app-navbar>
  </header>

  <!-- Container offset for fixed header -->
  <div class="pt-16 flex-1 flex flex-col min-w-0 w-full">
    
    <!-- Breadcrumb Bar -->
    <div class="bg-slate-500 shadow-md px-2 sm:px-4 py-2 z-30">
      <app-breadcrumb></app-breadcrumb>
    </div>

    <!-- Body Section (Sidebar + Content) -->
    <div class="flex-1 flex relative min-w-0 w-full">
      
      <!-- Backdrop Overlay للموبايل -->
      @if (isopenersidebar() && isMobile) {
        <div (click)="togglemenu()" class="fixed inset-0 bg-black/40 z-40 md:hidden backdrop-blur-xs"></div>
      }

      <!-- Sidebar -->
      <aside class="z-30 shrink-0">
        <app-sidebar></app-sidebar>
      </aside>

      <!-- Main Content Area -->
      <main class="flex-1 w-full min-w-0 p-4 sm:p-6 overflow-x-hidden">
        <router-outlet></router-outlet>
      </main>

    </div>
  </div>

</div>
