<div class="h-full">
  <!-- Sidebar Container -->
  <aside 
    class="fixed md:relative top-16 md:top-0 left-0 h-[calc(100vh-4rem)] md:h-full dark:bg-gray-800 bg-cyan-50 shadow-2xl transition-all duration-300 flex flex-col z-40"
    [class.w-64]="isopenersidebar()"
    [class.w-14]="!isopenersidebar()">
    
    <div class="p-3 flex items-center justify-between border-b dark:border-gray-700">
      <button class="cursor-pointer p-1.5 rounded-lg bg-amber-50 hover:bg-amber-100 text-gray-700" (click)="togglemenu()">
        <svg 
          xmlns="http://www.w3.org/2000/svg" 
          width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" 
          class="transition-transform duration-300"
          [class.rotate-180]="!isopenersidebar()"
        >
          <path d="m15 18-6-6 6-6"/>
        </svg>
      </button>
    </div>

    <nav class="flex-1 overflow-y-auto p-2">
      <ul class="space-y-1.5">
        <li>
          <a routerLink="/" class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700">
            <span class="text-base">🏠</span>
            @if(isopenersidebar()){ <span>Home</span> }
          </a>
        </li>

        <li>
          <a routerLink="/students" class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700">
            <span class="text-base">🎓</span>
            @if(isopenersidebar()){ <span>Students</span> }
          </a>
        </li>

        <li>
          <a routerLink="/dashboard" class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700">
            <span class="text-base">📊</span>
            @if(isopenersidebar()){ <span>Dashboard</span> }
          </a>
        </li>

        <li>
          <a routerLink="/teacher" class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700">
            <span class="text-base">👨‍🏫</span>
            @if(isopenersidebar()){ <span>Teachers</span> }
          </a>
        </li>

        <li>
          <a routerLink="/regist" class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium uppercase text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700">
            <span class="text-base">📝</span>
            @if(isopenersidebar()){ <span>Registration</span> }
          </a>
        </li>

        <li>
          <a href="#" class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700">
            <span class="text-base">📚</span>
            @if(isopenersidebar()){ <span>Courses</span> }
          </a>
        </li>

        <li>
          <a href="#" class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700">
            <span class="text-base">📅</span>
            @if(isopenersidebar()){ <span>Attendance</span> }
          </a>
        </li>
      </ul>
    </nav>
  </aside>
</div>
