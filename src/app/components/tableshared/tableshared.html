<div class="w-full">
  <div class="overflow-x-auto [&::-webkit-scrollbar]:h-2 [&::-webkit-scrollbar-thumb]:rounded-none [&::-webkit-scrollbar-track]:bg-gray-900 dark:[&::-webkit-scrollbar-track]:bg-neutral-700 [&::-webkit-scrollbar-thumb]:bg-gray-300 dark:[&::-webkit-scrollbar-thumb]:bg-neutral-500">
    <table class="min-w-full divide-y divide-gray-200 dark:divide-neutral-700 text-start">
      <thead class="bg-gray-50 dark:bg-neutral-800">
        <tr>
          @for (col of columns(); track col) {
            <th class="px-3 sm:px-6 py-3 text-start text-xs font-bold text-gray-500 dark:text-neutral-400 uppercase whitespace-nowrap">
              {{ col }}
            </th>
          }
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-500 dark:divide-neutral-700">
        <ng-content></ng-content>
      </tbody>
    </table>
  </div>
</div>
