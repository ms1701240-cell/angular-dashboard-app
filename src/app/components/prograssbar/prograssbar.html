<ol class="flex items-center justify-between p-3 sm:p-4 text-xs sm:text-sm font-medium text-center text-body bg-gray-200 dark:bg-blue-950 w-full max-w-xl mx-auto rounded-2xl sm:rounded-3xl shadow-lg overflow-x-auto">
  @for (step of steps; track step.number; let last = $last) {
    <li class="flex items-center">
      <div class="flex items-center gap-1.5 sm:gap-2">
        <span class="step-circle shrink-0 w-6 h-6 sm:w-8 sm:h-8 text-xs sm:text-sm flex items-center justify-center rounded-full"
              [class.step-completed]="currentstep() > step.number"
              [class.step-active]="currentstep() === step.number"
              [class.step-pending]="currentstep() < step.number">
          @if (currentstep() > step.number) { ✓ } @else { {{ step.number }} }
        </span>
        
        <!-- إخفاء عنوان الخطوة في الموبايل وإظهاره في الشاشات الأكبر -->
        <span class="hidden md:inline whitespace-nowrap">{{ step.title }}</span>
      </div>

      @if (!last) {
        <svg class="w-3 h-3 sm:w-4 sm:h-4 mx-1.5 sm:mx-3 rtl:rotate-180 shrink-0 opacity-70" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m7 16 4-4-4-4m6 8 4-4-4-4"/>
        </svg>
      }
    </li>
  }
</ol>
